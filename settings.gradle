pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        gradlePluginPortal()
    }
}

rootProject.name = 'lootfeed'

include 'core'

def only = (providers.gradleProperty('only').orNull ?: '').tokenize(',')
def loaders = (providers.gradleProperty('loaders').orNull ?: '').tokenize(',')

file('versions').listFiles().findAll { it.directory }.sort().each { version ->
    if (only && !only.contains(version.name)) {
        return
    }
    version.listFiles().findAll { new File(it, 'gradle.properties').file }.sort().each { loader ->
        if (!loaders || loaders.contains(loader.name)) {
            include "${version.name}:${loader.name}"
        }
    }
    project(":${version.name}").projectDir = version
    project(":${version.name}").children.each { it.projectDir = new File(version, it.name) }
}
